<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Virtusa Computers Store – Browse Hot Deals, New Arrivals, and Offers on laptops, computers, and mobile phones.">
  <title>Store – Virtusa Computers</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<header id="site-header"></header>
<nav id="site-nav"></nav>

<!-- Page Hero -->
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="sep">›</span>
      <span class="current">Store</span>
    </div>
    <h1>🏪 Our Store</h1>
    <p>Browse our curated selection of hot deals, new arrivals, and special offers — updated weekly.</p>
  </div>
</div>

<!-- Main Content -->
<div class="container section">

  <!-- Search Bar -->
  <div style="position:relative; max-width: 600px; margin: 0 auto var(--space-12);">
    <span style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none;">🔍</span>
    <input
      type="text"
      id="store-search"
      class="form-control"
      style="padding-left: 2.8rem; border-radius: var(--radius-full); font-size: var(--text-base);"
      placeholder="Search products..."
      autocomplete="off"
    >
  </div>

  <!-- Quick Category Filters -->
  <div style="display:flex; gap:var(--space-3); justify-content:center; margin-bottom:var(--space-12); flex-wrap:wrap;">
    <button class="btn btn-primary" data-cat="all" id="filter-all">All Products</button>
    <button class="btn btn-ghost" data-cat="laptops" id="filter-laptops">💻 Laptops</button>
    <button class="btn btn-ghost" data-cat="computers" id="filter-computers">🖥️ Computers</button>
    <button class="btn btn-ghost" data-cat="mobiles" id="filter-mobiles">📱 Mobiles</button>
  </div>

  <!-- Hot Deals -->
  <div class="store-section" id="hot-deals-section">
    <div class="store-section-header">
      <div class="title-wrap">
        <div class="title-icon" style="background:rgba(245,158,11,0.15);">🔥</div>
        <h2>Hot Deals</h2>
      </div>
      <a href="category.html?cat=all" class="btn btn-ghost btn-sm">View All →</a>
    </div>
    <div class="products-row" id="hot-deals-grid"></div>
  </div>

  <div class="divider"></div>

  <!-- New Arrivals -->
  <div class="store-section" id="new-arrivals-section">
    <div class="store-section-header">
      <div class="title-wrap">
        <div class="title-icon" style="background:rgba(0,212,255,0.15);">✨</div>
        <h2>New Arrivals</h2>
      </div>
      <a href="category.html?cat=all" class="btn btn-ghost btn-sm">View All →</a>
    </div>
    <div class="products-row" id="new-arrivals-grid"></div>
  </div>

  <div class="divider"></div>

  <!-- All Products / Filtered Results -->
  <div class="store-section" id="all-products-section">
    <div class="store-section-header">
      <div class="title-wrap">
        <div class="title-icon" style="background:rgba(124,58,237,0.15);">🛍️</div>
        <h2 id="all-products-title">All Products</h2>
      </div>
      <div style="display:flex;gap:var(--space-3);align-items:center;">
        <span id="results-count-store" style="font-size:var(--text-sm);color:var(--text-muted);"></span>
        <select class="sort-select" id="store-sort">
          <option value="default">Sort: Featured</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="name-asc">Name: A → Z</option>
          <option value="rating-desc">Top Rated</option>
          <option value="discount">Biggest Discount</option>
        </select>
      </div>
    </div>
    <div class="products-grid" id="all-products-grid"></div>
  </div>

</div>

<footer id="site-footer"></footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('store');
  renderFooter();

  // ─── Hot Deals ─────────────────────────────────────
  const hotDeals = getHotDeals();
  document.getElementById('hot-deals-grid').innerHTML =
    hotDeals.length
      ? hotDeals.map((p, i) => renderProductCard(p, true, i * 0.08)).join('')
      : '<p style="color:var(--text-muted)">No hot deals right now.</p>';

  // ─── New Arrivals ───────────────────────────────────
  const newArrivals = getNewArrivals();
  document.getElementById('new-arrivals-grid').innerHTML =
    newArrivals.length
      ? newArrivals.map((p, i) => renderProductCard(p, true, i * 0.08)).join('')
      : '<p style="color:var(--text-muted)">No new arrivals right now.</p>';

  // ─── All Products ───────────────────────────────────
  let activeCategory = 'all';
  let currentProducts = [...PRODUCTS];

  function applyStoreFilters() {
    const q = document.getElementById('store-search').value.toLowerCase().trim();
    const sort = document.getElementById('store-sort').value;

    let results = activeCategory === 'all'
      ? [...PRODUCTS]
      : PRODUCTS.filter(p => p.category === activeCategory);

    if (q) {
      results = results.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.category.toLowerCase().includes(q)
      );
    }

    if (sort === 'price-asc')   results.sort((a,b) => a.price - b.price);
    if (sort === 'price-desc')  results.sort((a,b) => b.price - a.price);
    if (sort === 'name-asc')    results.sort((a,b) => a.name.localeCompare(b.name));
    if (sort === 'rating-desc') results.sort((a,b) => b.rating - a.rating);
    if (sort === 'discount')    results.sort((a,b) => {
      const da = a.originalPrice ? (a.originalPrice - a.price) / a.originalPrice : 0;
      const db = b.originalPrice ? (b.originalPrice - b.price) / b.originalPrice : 0;
      return db - da;
    });

    currentProducts = results;
    renderAllGrid();
  }

  function renderAllGrid() {
    const grid = document.getElementById('all-products-grid');
    const count = currentProducts.length;
    document.getElementById('results-count-store').textContent = `${count} product${count !== 1 ? 's' : ''}`;

    const catNames = { all:'All Products', laptops:'💻 Laptops', computers:'🖥️ Computers', mobiles:'📱 Mobiles' };
    const q = document.getElementById('store-search').value.trim();
    document.getElementById('all-products-title').textContent =
      q ? `Search: "${q}"` : catNames[activeCategory];

    if (count === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🔍</div>
        <h3>No products found</h3>
        <p>Try a different search term or category.</p>
      </div>`;
    } else {
      grid.innerHTML = currentProducts.map((p, i) => renderProductCard(p, true, i * 0.04)).join('');
    }
  }

  // Category filter buttons
  document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      // Update button styles
      document.querySelectorAll('[data-cat]').forEach(b => {
        b.className = b.dataset.cat === activeCategory ? 'btn btn-primary' : 'btn btn-ghost';
      });
      applyStoreFilters();
    });
  });

  document.getElementById('store-search').addEventListener('input', applyStoreFilters);
  document.getElementById('store-sort').addEventListener('change', applyStoreFilters);

  // Initial render
  applyStoreFilters();
</script>
</body>
</html>
